<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAI - 운동 분석 서비스</title>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #222; padding: 20px; border-radius: 10px; }
        h1 { text-align: center; color: #007acc; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        input { background: #333; color: #fff; }
        button { background: #007acc; color: #fff; cursor: pointer; font-weight: bold; }
        #result { margin-top: 20px; padding: 15px; background: #333; border-radius: 5px; min-height: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️‍♂️ FitAI 운동 분석</h1>
        <label>오늘 한 운동 이름:</label>
        <input type="text" id="workout-name" placeholder="예: 스쿼트, 런닝">
        <label>운동 시간 (분):</label>
        <input type="number" id="workout-time" placeholder="예: 30">
        <label>운동 강도:</label>
        <input type="text" id="workout-intensity" placeholder="예: 고강도, 보통">
        <button onclick="analyzeWorkout()">운동 기록 분석하기</button>
        
        <h3>🤖 AI 분석 피드백 결과</h3>
        <div id="result">운동을 입력하고 버튼을 누르면 Gemini AI 피드백이 여기에 표시됩니다.</div>
    </div>

    <div id="api-key-box" style="position: fixed; bottom: 10px; right: 10px; background: #222; color: #fff; padding: 10px; border-radius: 8px; font-size: 12px; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #444;">
        <label style="display:block; margin-bottom:5px;">Gemini API Key 입력:</label>
        <input type="password" id="gemini-key-input" placeholder="AIzaSy..." style="background:#333; color:#fff; border:1px solid #555; padding:4px; border-radius:4px; width:150px; margin-right:5px; display:inline-block;">
        <button onclick="saveApiKey()" style="background:#007acc; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; width:auto; display:inline-block; margin:0;">저장</button>
    </div>

    <script>
    // 1. 입력창 키 저장 기능
    function saveApiKey() {
        const keyInput = document.getElementById('gemini-key-input').value.trim();
        if (keyInput) {
            localStorage.setItem('gemini_api_key', keyInput);
            alert("API 키가 안전하게 저장되었습니다! 이제 운동을 입력해 보세요.");
        } else {
            alert("키를 입력해주세요.");
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            document.getElementById('gemini-key-input').value = savedKey;
        }
    });

    // 2. 운동 데이터 분석 및 Gemini AI 호출 기능
    async function analyzeWorkout() {
        const name = document.getElementById('workout-name').value;
        const time = document.getElementById('workout-time').value;
        const intensity = document.getElementById('workout-intensity').value;
        const resultDiv = document.getElementById('result');

        if (!name || !time || !intensity) {
            alert("모든 칸을 입력해 주세요!");
            return;
        }

        const apiKey = localStorage.getItem('gemini_api_key');
        if (!apiKey) {
            alert("우측 하단에 Gemini API Key를 먼저 입력하고 [저장]을 눌러주세요!");
            return;
        }

        resultDiv.textContent = "🤖 Gemini AI가 운동 데이터를 분석하고 있습니다...";

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        const promptText = `사용자의 운동 기록입니다. 운동종목: ${name}, 시간: ${time}분, 강도: ${intensity}. 이 데이터를 분석해서 소모 칼로리 유추, 운동 강도 판정(적절/부족/과함), 그리고 신체 밸런스를 위한 피드백을 친절하게 3줄 이내로 대답해줘.`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const feedback = data.candidates[0].content.parts[0].text;
                resultDiv.innerHTML = feedback.replace(/\n/g, "<br>");
            } else {
                resultDiv.textContent = "AI 답변 형식이 올바르지 않습니다. API 키를 다시 확인해 주세요.";
            }
        } catch (error) {
            console.error(error);
            resultDiv.textContent = "에러가 발생했습니다. API 키가 유효한지 확인해 주세요.";
        }
    }
    </script>
</body>
</html>
